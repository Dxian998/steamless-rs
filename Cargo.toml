[package]
name = "steamless-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "CC-BY-NC-ND-4.0"
description = "Core library for SteamStub DRM unpacking in Rust."

[lib]
name = "steamless_rs"
path = "src/lib.rs"

[dependencies]
aes = "0.9"
cipher = "0.5"
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"